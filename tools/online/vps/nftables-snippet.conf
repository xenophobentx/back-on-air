# Lines for the input chain of the shared box's nftables.conf (policy drop), next to the console port's
# "udp dport 31871 accept". Not a complete ruleset: the file is owned by the split-second project, which applies
# it by hand (nft -c -f first, a second ssh session open).
#
#   31120  authentication   fixed in the game's code
#   31121  secure server    must differ from 31120 (the client refuses a secure server on the authentication port)
#   31122  relay            one multiplexed port for game traffic between players who cannot reach each other
#                           directly (signed datagrams, forwarded only between two members of one game)

    # split-second PC online (Rendez-Vous server, splitsecond-rdv.service)
    udp dport 31120-31122 accept
